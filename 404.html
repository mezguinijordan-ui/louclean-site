<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Page introuvable — LouClean</title>
<meta name="robots" content="noindex, follow">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --green-dark: #04342C; --green-bright: #1D9E75; --green-light: #5DCAA5; }
  body { font-family: 'DM Sans', sans-serif; background: var(--green-dark); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px; }
  .logo { font-family: 'DM Serif Display', serif; font-size: 28px; color: #fff; text-decoration: none; margin-bottom: 48px; }
  .logo span { color: var(--green-light); }
  h1 { font-family: 'DM Serif Display', serif; font-size: clamp(80px, 15vw, 140px); color: var(--green-light); line-height: 1; margin-bottom: 16px; letter-spacing: -4px; }
  h2 { font-family: 'DM Serif Display', serif; font-size: clamp(24px, 4vw, 36px); color: #fff; margin-bottom: 16px; }
  p { font-size: 16px; color: rgba(255,255,255,0.6); max-width: 420px; line-height: 1.7; margin-bottom: 40px; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-primary { background: #fff; color: var(--green-dark); padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; font-family: 'DM Sans', sans-serif; }
  .btn-ghost { background: transparent; color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.2); padding: 14px 28px; border-radius: 10px; font-size: 15px; text-decoration: none; font-family: 'DM Sans', sans-serif; }
</style>
</head>
<body>
  <a href="/" class="logo">Lou<span>Clean</span></a>
  <h1>404</h1>
  <h2>Page introuvable</h2>
  <p>La page que vous cherchez n'existe pas ou a été déplacée. Retournez à l'accueil ou demandez un devis.</p>
  <div class="btns">
    <a href="/" class="btn-primary">Retour à l'accueil</a>
    <a href="/#devis" class="btn-ghost">Demander un devis</a>
  </div>
</body>
</html>
